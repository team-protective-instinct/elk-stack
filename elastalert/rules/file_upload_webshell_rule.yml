name: "Web Shell Upload Detected"
type: any

index: ".ds-logs-generic-default-*"

filter:
- query:
    query_string:
      query: >
        (fields.service:"dvwa-apache" OR service.name:"dvwa-apache")
        AND
        message:("/vulnerabilities/upload/" OR "/hackable/uploads/" OR "shell.php" OR "recon_shell.php" OR ".htaccess.php" OR "avatar.php" OR "cmd=" OR "q=" OR "c=" OR "SHELL_OK" OR "BACKDOOR_ALIVE")

alert:
- "post"

# 전달받은 Webhook URL
http_post_url: "http://host.docker.internal:8000/webhook"

# Webhook으로 전송될 JSON 페이로드 구조
http_post_payload:
  timestamp: "@timestamp"
  log_message: "message"

http_post_static_payload:
  title: "Web Shell 업로드 탐지"
  rule_name: "File Upload Webshell Webhook Rule"
  alert_name: "webshell_upload_detected"
  severity: "high"

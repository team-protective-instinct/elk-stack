name: "Command Injection Detected"
type: any

index: ".ds-logs-generic-default-*"

filter:
- query:
    query_string:
      query: >
        (fields.service:"dvwa-apache" OR service.name:"dvwa-apache")
        AND
        message:("/vulnerabilities/exec/" OR "VULN_TEST" OR "PIPE_TEST" OR "%3B" OR "%7C")

alert:
- "post"

# 전달받은 Webhook URL
http_post_url: "http://host.docker.internal:8000/webhook"

# Webhook으로 전송될 JSON 페이로드 구조
http_post_payload:
  timestamp: "@timestamp"
  log_message: "message"

http_post_static_payload:
  title: "Command Injection 공격 탐지"
  rule_name: "Command Injection Webhook Rule"
  alert_name: "command_injection_detected"
  severity: "high"

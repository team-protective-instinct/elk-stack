name: "Brute Force Activity Detected"
type: frequency

index: ".ds-logs-generic-default-*"

num_events: 5
timeframe:
  minutes: 3

filter:
- query:
    query_string:
      query: >
        (fields.service:"metasploitable2-apache" OR service.name:"metasploitable2-apache" OR fields.service:"modsecurity-waf" OR service.name:"modsecurity-waf")
        AND
        message:("/vulnerabilities/brute/" AND "password=")

alert:
- "post"

# 전달받은 Webhook URL
http_post_url: "http://host.docker.internal:8000/webhook"

# Webhook으로 전송될 JSON 페이로드 구조
http_post_payload:
  timestamp: "@timestamp"
  log_message: "message"

http_post_static_payload:
  title: "Brute Force 공격 탐지"
  rule_name: "Brute Force Webhook Rule"
  alert_name: "brute_force_detected"
  severity: "medium"

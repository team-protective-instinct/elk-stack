name: "SQL Injection Detected"
type: any

index: ".ds-logs-generic-default-*"

filter:
- query:
    query_string:
      query: >
        (fields.service:"dvwa-apache" OR service.name:"dvwa-apache")
        AND
        message:("/vulnerabilities/sqli/" AND ("UNION SELECT" OR "information_schema" OR "sleep(" OR "waitfor delay" OR "1%3D1" OR "1%27%3D1" OR "%27%20OR%201%3D1"))

alert:
- "post"

# 전달받은 Webhook URL
http_post_url: "http://host.docker.internal:8000/webhook"

# Webhook으로 전송될 JSON 페이로드 구조
http_post_payload:
  timestamp: "@timestamp"
  log_message: "message"

http_post_static_payload:
  title: "SQL Injection 공격 탐지"
  rule_name: "SQLi Webhook Rule"
  alert_name: "sql_injection_detected"
  severity: "high"

name: "SQL Injection Detected"
type: any

# 모든 인덱스를 대상으로 하거나, Filebeat 관련 인덱스로 한정할 수 있습니다.
index: "*" 

filter:
- query:
    query_string:
      # 간단한 SQL Injection 탐지 룰 (apache access log 등에 기록되는 쿼리 검사)
      query: "message:(\"union\" OR \"select\" OR \"sleep\" OR \"waitfor\" OR \"*%27*\" OR \"*--*\")"

alert:
- "post"

# 전달받은 Webhook URL
http_post_url: "https://webhook.site/c40501bc-907d-4e53-b4bb-ebd74a4e79f9"

# Webhook으로 전송될 JSON 페이로드 구조
http_post_payload:
  title: "🚨 SQL Injection 공격 탐지 🚨"
  rule_name: "SQLi Webhook Rule"
  timestamp: "%(@timestamp)s"
  log_message: "%(message)s"


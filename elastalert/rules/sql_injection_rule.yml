name: "SQL Injection Detected"
type: any

index: ".ds-logs-generic-default-*"

filter:
- query:
    query_string:
      query: >
        (fields.service:"metasploitable2-apache" OR service.name:"metasploitable2-apache")
        AND
        message:("/vulnerabilities/sqli/" OR "UNION" OR "SELECT" OR "FROM" OR "users" OR "password" OR "information_schema" OR "database" OR "version" OR "waitfor" OR "sleep" OR "%27" OR "%25%27" OR "%3D" OR "%23" OR "%2C" OR "1%3D0" OR "1%3D1")

alert:
- "post"

# 전달받은 Webhook URL
http_post_url: "http://host.docker.internal:8000/webhook"

# Webhook으로 전송될 JSON 페이로드 구조
http_post_payload:
  timestamp: "@timestamp"
  log_message: "message"

http_post_static_payload:
  title: "SQL Injection 공격 탐지"
  rule_name: "SQLi Webhook Rule"
  alert_name: "sql_injection_detected"
  severity: "high"
